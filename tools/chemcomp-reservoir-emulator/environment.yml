name: chemcomp
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.9,<3.13
  - numpy>=1.21
  - scipy>=1.7
  - scikit-learn>=1.0
  - matplotlib>=3.4
  - networkx>=2.6
  - pandas>=1.3
  # Notebooks
  - jupyterlab>=3.0
  - ipywidgets>=7.0
  - ipykernel
  # Development
  - pytest>=7.0
  - pytest-cov
  - black
  - ruff
  - pip
  - pip:
    - -e .

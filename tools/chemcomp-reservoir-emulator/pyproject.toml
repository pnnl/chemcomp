[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemcomp-emulation"
version = "1.0.0"
description = "ChemComp emulation module: solve ODEs and PDEs using chemical reaction network-based reservoir computing"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "ChemComp Team"},
]
keywords = [
    "reservoir computing",
    "chemical reaction networks",
    "differential equations",
    "ODE",
    "PDE",
    "Bayesian optimization",
    "scientific computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.4",
    "networkx>=2.6",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
]
notebooks = [
    "jupyterlab>=3.0",
    "ipywidgets>=7.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme",
    "numpydoc",
]

[project.urls]
Homepage = "https://github.com/pnnl/chemcomp"
Documentation = "https://chemcomp.readthedocs.io"
Repository = "https://github.com/pnnl/chemcomp"

[project.scripts]
chemcomp-smoke-test = "chemical_reservoir.scripts.smoke_test:main"

[tool.setuptools.packages.find]
include = ["chemical_reservoir*"]

[tool.setuptools.package-data]
# Network configs are stored at top-level network_configs/, not inside the package

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
